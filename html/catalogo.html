<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../imagenes/logo.png" type="image/png" />
    <title>Bolsos Pre-Hechos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/catalogo.css" />
  </head>

  <header>
    <section id="set">
        <div>
            <img id="logoH" src="../imagenes/logo.png">
        </div>
        <div>
            <h3>
                <lo><a id="textoH" href="../ReStitch/index.html">Inicio</a><a id="textoH"
                        href="../ReStitch/html/catalogo.html">Catálogo</a> <a id="textoH"
                        href="../ReStitch/html/comentarios.html">Contacto</a></lo>
            </h3>
        </div>
    </section>
</header>

  <body>
    <div class="page">
      <button class="info-btn">Info</button>

      <div class="outer-card">
        <h1 class="title">Bolsos Pre Hechos</h1>

        <!-- Carrusel de bolsos (mismo patrón que el carrusel de telas) -->
        <div class="inner-card">
          <div class="stage" id="stage"></div>
          <div class="controls">
            <button class="arr" id="prev">&#8592;</button>
            <div class="dots" id="dots"></div>
            <button class="arr" id="next">&#8594;</button>
          </div>
          <p class="fabric-name" id="bagName"></p>
        </div>

        <!-- Selector de tela -->
        <h2 class="title sizes-title">Selecciona tu tela!</h2>

        <div class="inner-card">
          <div class="swatch-row" id="swatchRow"></div>
          <div class="tela-preview">
            <div class="tela-preview-swatch" id="telaPreviewSwatch"></div>
            <p class="tela-preview-name" id="telaPreviewName">Elige una tela</p>
          </div>
        </div>

        <div class="bottom">
          <button class="ver-btn" id="verBtn">Elegir este bolso</button>
        </div>
      </div>
    </div>

    <script src="../js/catalogo.js"></script>
  </body>
</html>
